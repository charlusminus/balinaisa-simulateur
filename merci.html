<!DOCTYPE html>
<!-- Page de confirmation. DEUX entrees, et c est voulu :
     1. la redirection du workflow n8n apres le webhook hotlead, avec ?name et ?email, qui
        personnalisent le titre ;
     2. GitHub Pages sert ce fichier sur /merci, donc un acces direct ou un rafraichissement
        apres une simulation tombe ici plutot que sur l ecran de fin du simulateur (#step-5
        dans index.html), qui vit a la meme URL via l historique.
     Les deux ecrans montrent donc les MEMES actions, partage compris : c est la seule facon
     de ne pas donner deux confirmations differentes selon la porte d entree. -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KN42LDBT');</script>
  <!-- End Google Tag Manager -->
  <!-- Analytics respectueux de la vie privée (Plausible) : sans cookie, sans donnée perso, exempté CNIL -->
  <script async src="https://plausible.io/js/pa-LQmhy-Wx5R6u7vxz-r8EF.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  <meta name="robots" content="noindex, nofollow">
  <!-- L'anti-flash (data-i18n-pending) est retire le 03/09 : plus rien ne levait l'attribut
       depuis que la langue vient du chemin, un navigateur non francophone voyait donc une
       page vide. i18n.js en defer, comme sur l'accueil. -->
  <script src="i18n.js?v=20260903d" defer></script>
  <title>Intérêt confirmé · Balinaisa</title>
  <!-- Icones : un seul bloc, identique sur toutes les pages. Elles divergeaient page par page
       (SVG seul ici, PNG seul la, trois ?v= differents, chemins tantot relatifs tantot absolus).
       Chemins ABSOLUS : une page rangee dans un sous-repertoire resoudrait un chemin relatif
       depuis son propre dossier. La marque est reversee en ivoire sur le teck dore : en encre
       sur ivoire, le trace filiforme ne laisse que 2 pixels sombres sur 256 a 16 px et
       disparait dans une barre d onglets claire. -->
  <link rel="icon" href="/favicon.svg?v=20260903" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=20260903">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260903">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#C3875E">
  <link href="fonts/fonts.css?v=20260902" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F3EC; --bg-card: #FDFDFD; --primary: #A85A20; --primary-dark: #8A4818;
      /* Le CTA garde le dore de marque, avec l ENCRE dessus (5.14). Sa bordure vaut son fond :
         aucun filet d une autre couleur autour d un bouton. 11/09. */
      --primary-surface: #C3875E; --primary-surface-hover: #CE9469; --on-primary: #242424;
      --sauge-fonce: #444535; --sauge-clair: #D6D7CE;
      --text: #242424; --text-sub: #807869; --text-muted: #6F685B; --border: #F0E4CC;
      --font-serif: 'Cormorant Garamond', Georgia, serif; --font-sans: 'Inter', system-ui, sans-serif;
      --font-caps: 'Josefin Sans', 'Century Gothic', 'Avenir', sans-serif;
      --tracking-caps: 0.14em;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px; line-height: 1.6; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0;
      max-width: 520px; width: 100%; padding: 44px 38px; text-align: center;
      box-shadow: 0 8px 40px rgba(42,31,20,.08); }
    .badge { width: 60px; height: 60px; border-radius: 50%; background: #EBF5EF; color: #3D7A5A;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
    h1 { font-family: var(--font-serif); font-size: 30px; font-weight: 600; margin-bottom: 12px; letter-spacing: -.01em; }
    p { font-size: 15px; color: var(--text-sub); margin-bottom: 14px; }
    .email { display: inline-block; background: #F5EDE0; color: var(--primary-dark); font-weight: 500;
      padding: 6px 14px; border-radius: 0; font-size: 14px; margin: 4px 0 22px; word-break: break-all; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
    /* Meme signature que les CTA du simulateur : Josefin en capitales, graisse 400, chasse au
       jeton, angles droits, et une bordure d un pixel qui vaut le fond du bouton, ou la couleur
       de son texte quand il est au filet. Ces deux boutons etaient en Inter 500 bas de casse. */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 24px; border: 1px solid transparent; border-radius: 0;
      font-family: var(--font-caps); font-size: 13px; font-weight: 400;
      letter-spacing: var(--tracking-caps); text-transform: uppercase;
      text-decoration: none; transition: .18s; }
    .btn-primary { background: var(--primary-surface); color: var(--on-primary); border-color: var(--primary-surface); }
    .btn-primary:hover { background: var(--primary-surface-hover); border-color: var(--primary-surface-hover); }
    /* Actions secondaires en sauge, comme l ecran de fin du simulateur. L aplat clair porte
       l encre (10.70), l etat actif bascule sur le sauge fonce avec du blanc (9.77) : c est la
       clarte du fond qui decide du texte. Le filet est le meme partout, y compris pour la
       navigation : il n y a plus de filet encre depuis le 11/09. */
    .btn-secondaire { background: var(--sauge-clair); color: var(--text); border-color: var(--sauge-clair); }
    .btn-ghost { background: transparent; color: var(--sauge-fonce); border-color: var(--sauge-fonce); }
    .btn-secondaire:hover, .btn-secondaire:focus-visible,
    .btn-ghost:hover, .btn-ghost:focus-visible {
      background: var(--sauge-fonce); color: #fff; border-color: var(--sauge-fonce);
    }
    .foot { font-size: 12px; color: var(--text-muted); margin-top: 26px; font-style: italic; }
    a:focus-visible, .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KN42LDBT"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1 id="title">Votre intérêt est confirmé</h1>
    <p id="lead">Merci. Un conseiller Balinaisa va vous recontacter pour affiner votre projet et répondre à vos questions.</p>
    <div class="email" id="email-box" hidden></div>
    <div class="actions">
      <a class="btn btn-primary" href="https://balinaisa.com" target="_blank" rel="noopener">Découvrir la collection Balinaisa</a>
      <button type="button" class="btn btn-secondaire" onclick="partager()">Partager Balinaisa.ai</button>
      <a class="btn btn-ghost" href="https://balinaisa.ai/">Refaire une simulation</a>
    </div>
    <p class="foot">Chaque pièce est façonnée à la main en teck massif, en Indonésie.</p>
  </main>
  <script>
    /* Meme partage que l ecran de fin du simulateur : un seul bloc de texte, car
       navigator.share concatene text+url dans un ordre non garanti, et une url courte
       parce que les clients de messagerie n affichent que du texte brut. */
    function partager() {
      var T = function (fr) { return (window.i18n && window.i18n.t) ? window.i18n.t(fr) : fr; };
      var url = 'https://balinaisa.ai/?utm_source=partage';
      var message = [
        T('Salut,'), '',
        T("J'ai découvert Balinaisa.ai, le simulateur d'aménagement (intérieur et extérieur), proposé par Dominique, le fondateur de la société Balinaisa."), '',
        T('Une photo de ton espace suffit.'), '',
        url, '',
        T("Essaye, c'est surprenant."), '',
        T("Hâte d'avoir ton retour,"),
        T('À très vite,')
      ].join('\n');
      if (navigator.share) {
        navigator.share({ title: 'Balinaisa.ai · Balinaisa', text: message }).catch(function () {});
      } else {
        window.open('https://wa.me/?text=' + encodeURIComponent(message), '_blank', 'noopener');
      }
    }

    (function () {
      var q = new URLSearchParams(window.location.search);
      var name = (q.get('name') || '').trim();
      var email = (q.get('email') || '').trim();
      if (name) {
        var first = name.split(' ')[0];
        document.getElementById('title').textContent = 'Merci ' + first + ', votre intérêt est confirmé';
      }
      if (email) {
        var box = document.getElementById('email-box');
        box.textContent = email;
        box.hidden = false;
        document.getElementById('lead').textContent = 'Merci. Un conseiller Balinaisa va vous recontacter à cette adresse pour affiner votre projet et répondre à vos questions.';
      }
    })();
  </script>
</body>
</html>
